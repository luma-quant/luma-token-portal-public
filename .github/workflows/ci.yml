name: trust-reference-ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out complete candidate history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.18.0'
          cache: npm
      - name: Verify exact public source closure before tooling
        run: node scripts/verify-public-manifest.mjs
      - name: Install checksum-pinned Gitleaks CLI
        shell: bash
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_ARCHIVE_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          archive="${RUNNER_TEMP}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${archive}"
          echo "${GITLEAKS_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
          chmod +x "${RUNNER_TEMP}/gitleaks"
      - name: Scan source and history without GitHub API access
        shell: bash
        run: '"${RUNNER_TEMP}/gitleaks" git . --redact --verbose'
      - name: Install locked zero-dependency package
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit zero-dependency lock and registry advisories
        run: |
          npm run verify:dependencies
          npm audit --omit=dev --audit-level=low
      - name: Verify candidate
        run: npm run check
      - name: Confirm clean generated state
        run: git diff --exit-code -- . ':!dist'

  codeql:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Initialize CodeQL without build execution
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze and upload public-repository results
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          upload: always
          upload-database: true
